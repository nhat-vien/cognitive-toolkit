name: equilibria_mobile_flutter
description: >-
  Haven (Equilibria) — Local-First Multi-Platform CBT, TEAM-CBT, DBT &
  Bipolar IPSRT Clinical Companion for Anxiety, Depression, and Bipolar Disorder.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Hardware-Backed Local Encrypted Storage & Biometrics
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Biometrics, Offline Audio & Emergency Dialer
  health: ^11.1.0
  just_audio: ^0.9.42
  url_launcher: ^6.3.1

  # Clinical Charts & Printable A4 Clinician PDF Reports
  fl_chart: ^0.69.2
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/haven_icon.png"
  adaptive_icon_background: "#FAF9F6"
  adaptive_icon_foreground: "assets/icon/haven_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/haven_icon.png
