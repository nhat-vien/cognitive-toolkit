name: Mobile App (Flutter Android & iOS CI/CD)

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile-flutter/**"
      - ".github/workflows/mobile-flutter-ci.yml"
    tags:
      - "mobile-v*"
  pull_request:
    paths:
      - "apps/mobile-flutter/**"
      - ".github/workflows/mobile-flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: Flutter Analyze & Clinical Safety Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (3.29.3)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Run Flutter static analyzer
        run: flutter analyze

      - name: Run clinical safety & engine tests
        run: flutter test --reporter expanded

  build-android:
    name: Build Haven Android APK & Play Store AAB
    runs-on: ubuntu-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: apps/mobile-flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter (3.29.3)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true

      - name: Generate native Android & iOS project scaffolds
        run: flutter create --platforms=android,ios --org com.haven --project-name equilibria_mobile_flutter .

      - name: Configure Haven Android manifest, SDKs & Biometrics
        run: python3 tool/configure_native_platforms.py --platform android

      - name: Fetch dependencies & generate launcher icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Configure Gradle GCS Maven Mirror (prevent 429 rate limits)
        run: |
          mkdir -p ~/.gradle/init.d
          cat <<'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          beforeSettings { settings ->
              settings.pluginManagement.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().contains("repo.maven.apache.org")) {
                      repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2")
                  }
              }
          }
          allprojects {
              buildscript {
                  repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository && repo.url.toString().contains("repo.maven.apache.org")) {
                          repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2")
                      }
                  }
              }
              repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().contains("repo.maven.apache.org")) {
                      repo.url = uri("https://maven-central.storage-download.googleapis.com/maven2")
                  }
              }
          }
          EOF

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('apps/mobile-flutter/pubspec.yaml') }}
          restore-keys: |
            gradle-android-

      - name: Build Universal & Split APKs + Play Store AppBundle
        run: |
          OTA_VER=$(python3 -c "import json; print(json.load(open('ota-version.json'))['version'])")
          OTA_BUILD=$(python3 -c "import json; print(json.load(open('ota-version.json'))['buildNumber'])")
          echo "Embedding OTA version: $OTA_VER (Build $OTA_BUILD)"
          DART_FLAGS="--build-name=$OTA_VER --build-number=$OTA_BUILD --dart-define=HAVEN_APP_VERSION=$OTA_VER --dart-define=HAVEN_BUILD_NUMBER=$OTA_BUILD"
          for attempt in 1 2 3; do
            if flutter build apk --release $DART_FLAGS; then
              break
            fi
            echo "Retry flutter build apk ($attempt/3) after transient network error..."
            sleep 15
          done
          flutter build apk --release --split-per-abi $DART_FLAGS
          flutter build appbundle --release $DART_FLAGS
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/haven-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/haven-android-arm64-v8a.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/haven-android-playstore.aab
          cp ota-version.json dist/ota-version.json

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haven-android-builds
          path: apps/mobile-flutter/dist/

  build-ios:
    name: Build Haven iOS Unsigned IPA
    runs-on: macos-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: apps/mobile-flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (3.29.3)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true

      - name: Generate native Android & iOS project scaffolds
        run: flutter create --platforms=android,ios --org com.haven --project-name equilibria_mobile_flutter .

      - name: Fetch packages, generate icons & Podfile scaffold
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build ios --config-only --no-codesign || true

      - name: Configure Haven iOS Info.plist, Bundle ID & Podfile (iOS 14.0)
        run: python3 tool/configure_native_platforms.py --platform ios

      - name: Build iOS release binary (unsigned IPA)
        run: |
          OTA_VER=$(python3 -c "import json; print(json.load(open('ota-version.json'))['version'])")
          OTA_BUILD=$(python3 -c "import json; print(json.load(open('ota-version.json'))['buildNumber'])")
          flutter build ios --release --no-codesign --build-name=$OTA_VER --build-number=$OTA_BUILD --dart-define=HAVEN_APP_VERSION=$OTA_VER --dart-define=HAVEN_BUILD_NUMBER=$OTA_BUILD
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r dist/haven-ios-unsigned.ipa Payload

      - name: Upload iOS unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: haven-ios-unsigned-ipa
          path: apps/mobile-flutter/dist/haven-ios-unsigned.ipa

  publish-release:
    name: Publish Haven Mobile Release (APK, AAB & IPA)
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-ios
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android builds
        uses: actions/download-artifact@v4
        with:
          name: haven-android-builds
          path: release-assets

      - name: Download iOS IPA build
        uses: actions/download-artifact@v4
        with:
          name: haven-ios-unsigned-ipa
          path: release-assets

      - name: Determine release tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/mobile-v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=mobile-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.meta.outputs.tag }}"
          name: "Haven — Nơi Bình Yên (${{ steps.meta.outputs.tag }})"
          body: |
            Bản phát hành ứng dụng di động **Haven (Equilibria)** (`com.haven.equilibria`) — Đồng hành sức khỏe tâm trí CBT, TEAM-CBT, DBT & IPSRT ngoại tuyến, mã hóa AES-256 tại chỗ.

            ### Tệp cài đặt:
            - **`haven-android-universal.apk`**: File APK cài đặt trực tiếp trên mọi máy Android (API 26+).
            - **`haven-android-arm64-v8a.apk`**: Bản APK tối ưu dung lượng nhẹ cho điện thoại Android 64-bit hiện đại.
            - **`haven-android-playstore.aab`**: Gói App Bundle chuẩn phát hành Google Play Console.
            - **`haven-ios-unsigned.ipa`**: Gói IPA cho iOS (cài thử qua AltStore/Sideloadly hoặc ký lại với Apple Developer Team).
          files: |
            release-assets/haven-android-universal.apk
            release-assets/haven-android-arm64-v8a.apk
            release-assets/haven-android-playstore.aab
            release-assets/haven-ios-unsigned.ipa
            release-assets/ota-version.json
